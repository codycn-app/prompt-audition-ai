    <script>
      // Definitive Supabase Session Corruption Fix - "The Shield"
      // This script runs BEFORE React and the Supabase client are initialized.
      // Its purpose is to find and destroy any malformed or "poisonous" session data
      // in localStorage that would cause the Supabase client to hang silently on startup.
      (function() {
        try {
          const keysToDelete = [];
          for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            // Identify potential Supabase auth tokens
            if (key && key.startsWith('sb-') && key.endsWith('-auth-token')) {
              const value = localStorage.getItem(key);
              if (!value) {
                keysToDelete.push(key);
                continue;
              }
              try {
                const session = JSON.parse(value);
                // Perform rigorous validation. If any check fails, the key is invalid.
                if (
                  typeof session.access_token !== 'string' || !session.access_token ||
                  typeof session.refresh_token !== 'string' || !session.refresh_token ||
                  typeof session.user !== 'object' || session.user === null ||
                  typeof session.user.id !== 'string' || !session.user.id ||
                  session.user.aud !== 'authenticated'
                ) {
                  keysToDelete.push(key);
                }
              } catch (e) {
                // If it's not valid JSON, it's corrupted.
                keysToDelete.push(key);
              }
            }
          }
          // Delete all identified bad keys.
          for (const key of keysToDelete) {
            localStorage.removeItem(key);
          }
        } catch (e) {
          console.error("Error during pre-emptive session cleanup:", e);
        }
      })();

      // Definitive fix for black screen/flicker issue.
      // This script runs BEFORE React and applies the theme instantly.
      (function() {
        try {
          const theme = localStorage.getItem('theme');
          if (theme === 'light') {
            document.documentElement.classList.add('light');
          } else {
            // Default to dark if no theme is set or it's invalid.
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // Fallback to dark theme in case of any error.
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

      .welcome-crystal { transform-style: preserve-3d; animation: welcome-float 3.6s ease-in-out infinite; }
      .welcome-crystal::before, .welcome-crystal::after {

      .welcome-crystal::after { inset: 12px; border-color: rgba(255, 0, 230, 0.65); transform: rotate(22.5deg) translateZ(-2px); }
      @keyframes welcome-panel-in { from { opacity: 0; transform: translateY(18px) scale(0.96) rotateX(4deg); } to { opacity: 1; transform: translateY(0) scale(1) rotateX(1.5deg); } }
      @keyframes welcome-orbit { from { transform: translate(-50%, -50%) rotateX(63deg) rotateZ(0deg); } to { transform: translate(-50%, -50%) rotateX(63deg) rotateZ(360deg); } }
      @keyframes welcome-orbit-reverse { from { transform: translate(-50%, -50%) rotateX(68deg) rotateZ(360deg); } to { transform: translate(-50%, -50%) rotateX(68deg) rotateZ(0deg); } }
      @keyframes welcome-float { 0%, 100% { transform: translateY(0) rotateY(0); } 50% { transform: translateY(-6px) rotateY(12deg); } }
      @media (max-width: 640px) {
